name: Build Main Launcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Run Tests
        run: |
          bun test

  build-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: packages/raf-settings/go.sum

      - name: Build Go Settings CLI
        shell: bash
        run: |
          cd packages/raf-settings
          go build -ldflags="-s -w" -o raf-settings.exe .

      - name: Upload CLI Bin
        uses: actions/upload-artifact@v4
        with:
          name: internal-cli-bin-main
          path: packages/raf-settings/raf-settings.exe
          retention-days: 1

  build-release:
    runs-on: windows-latest
    needs: [build-cli]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno Canary
        uses: denoland/setup-deno@v2
        with:
          deno-version: canary

      - name: Install dependencies
        run: |
          bun install

      - name: Download CLI Bin
        uses: actions/download-artifact@v4
        with:
          name: internal-cli-bin-main
          path: dist/bin

      - name: Bundle & Compile Windows Executable
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p dist/build
          bun run scripts/generate-version.ts
          bun build index.tsx \
            --outdir dist/build \
            --target node \
            --minify \
            --sourcemap=external \
            --define process.env.API_URL="\"${API_URL}\"" \
            --define process.env.NODE_ENV="\"production\"" \
            --external @gpuix/native-darwin-arm64 \
            --external @gpuix/native-darwin-universal \
            --external @gpuix/native-win32-x64-msvc
          
          cat scripts/runtime-napi.ts dist/build/index.js > dist/build/bundle.js

          deno compile \
            --allow-all \
            --no-check \
            --no-terminal \
            --unsafely-ignore-certificate-errors \
            --target x86_64-pc-windows-msvc \
            --engine quickjs \
            --icon assets/icon.ico \
            --output dist/raf-launcher.exe \
            dist/build/bundle.js

          cp node_modules/@gpuix/native-win32-x64-msvc/gpuix-native.win32-x64-msvc.node dist/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-release-x64
          path: |
            dist/raf-launcher.exe
            dist/gpuix-native.win32-x64-msvc.node
            dist/bin
