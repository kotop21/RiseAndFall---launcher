name: Build Windows Launcher

on:
  push:
    branches: [ v2-gpuix-hermes ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-gpuix-hermes
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Setup MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Launcher Bundle
        shell: bash
        run: |
          bun hermes/build.ts
          perl -pi -e 's/\bimport\(/require(/g' hermes/dist/launcher.cjs

      - name: Fetch Windows Native Addon (@gpuix/native)
        shell: bash
        run: |
          mkdir -p dist/bin
          npm pack @gpuix/native-win32-x64-msvc@0.7.0 --pack-destination dist
          tar -xzf dist/*.tgz -C dist
          mv dist/package/gpuix-native.win32-x64-msvc.node dist/
          rm -rf dist/package dist/*.tgz
          cp hermes/dist/launcher.cjs dist/

      - name: Download Portable Node Runtime
        shell: bash
        run: |
          curl -fsSL https://nodejs.org/dist/v22.14.0/win-x64/node.exe -o dist/bin/node.exe

      - name: Compile Lightweight Windowless Launcher
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cat << 'EOF' > launcher.c
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          int WINAPI WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int nCmdShow) {
              STARTUPINFOA si;
              PROCESS_INFORMATION pi;
              ZeroMemory(&si, sizeof(si));
              si.cb = sizeof(si);
              ZeroMemory(&pi, sizeof(pi));

              char cmd[] = "bin\\node.exe launcher.cjs";

              if (CreateProcessA(
                      NULL,
                      cmd,
                      NULL,
                      NULL,
                      FALSE,
                      CREATE_NO_WINDOW,
                      NULL,
                      NULL,
                      &si,
                      &pi)) {
                  CloseHandle(pi.hProcess);
                  CloseHandle(pi.hThread);
                  return 0;
              }
              return 1;
          }
          EOF

          cl.exe -O2 -GL -GS- -Fe:dist/raf-launcher.exe launcher.c -link -subsystem:windows -incremental:no user32.lib kernel32.lib
          rm -f launcher.c launcher.obj

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-x64
          path: dist/
