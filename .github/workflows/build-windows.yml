name: Build Windows Launcher

on:
  push:
    branches: [ v2-gpuix-hermes ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-gpuix-hermes
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Build Executable
        run: |
          mkdir dist
          bun build --compile index.tsx --outfile dist/raf-launcher.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-x64
          path: dist/raf-launcher.exe
