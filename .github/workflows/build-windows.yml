name: Build Windows Launcher

on:
  push:
    branches: [ v2-gpuix-hermes ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-gpuix-hermes
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Setup MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and Optimize Executable (Bun)
        shell: bash
        run: |
          mkdir -p dist
          bun build index.tsx \
            --compile \
            --target=bun-windows-x64 \
            --minify \
            --sourcemap=none \
            --external=@gpuix/native \
            --outfile=dist/raf-launcher.exe

          editbin /nologo /subsystem:windows dist/raf-launcher.exe

      - name: Fetch Windows Native Addon (@gpuix/native)
        shell: bash
        run: |
          npm pack @gpuix/native-win32-x64-msvc@0.7.0 --pack-destination dist
          tar -xzf dist/*.tgz -C dist
          mv dist/package/gpuix-native.win32-x64-msvc.node dist/
          rm -rf dist/package dist/*.tgz

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-x64
          path: dist/
