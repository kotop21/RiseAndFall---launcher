name: Build Windows Launcher

on:
  push:
    branches: [ v2-gpuix-hermes ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2-gpuix-hermes
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Setup MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Launcher Bundle
        shell: bash
        run: |
          bun hermes/build.ts
          perl -pi -e 's/\bimport\(/require(/g' hermes/dist/launcher.cjs

      - name: Download Node.js Runtime & Setup SEA Tools
        shell: bash
        run: |
          curl -fsSL https://nodejs.org/dist/v22.14.0/win-x64/node.exe -o node-base.exe
          npm install -g postject

      - name: Pack JS Bundle directly into Executable (Node SEA)
        shell: bash
        run: |
          cat << 'EOF' > sea-config.json
          {
            "main": "hermes/dist/launcher.cjs",
            "output": "sea-prep.blob",
            "disableExperimentalSEAWarning": true,
            "useCodeCache": true
          }
          EOF

          ./node-base.exe --experimental-sea-config sea-config.json

          mkdir -p dist
          cp node-base.exe dist/raf-launcher.exe

          postject dist/raf-launcher.exe NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          editbin /subsystem:windows dist/raf-launcher.exe

      - name: Fetch Windows Native Addon (@gpuix/native)
        shell: bash
        run: |
          npm pack @gpuix/native-win32-x64-msvc@0.7.0 --pack-destination dist
          tar -xzf dist/*.tgz -C dist
          mv dist/package/gpuix-native.win32-x64-msvc.node dist/
          rm -rf dist/package dist/*.tgz node-base.exe sea-config.json sea-prep.blob

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-x64
          path: dist/
