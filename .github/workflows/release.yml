name: Build Release Launcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Build Windows Release Executable (No Console)
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p dist
          bun run scripts/generate-version.ts
          bun build --compile --windows-subsystem=windows --define process.env.API_URL="\"${API_URL}\"" index.tsx --outfile dist/raf-launcher.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-release-x64
          path: dist/raf-launcher.exe
