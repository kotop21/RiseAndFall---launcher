name: Release Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Run Tests
        run: |
          bun test

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: packages/raf-settings/go.sum

      - name: Test & Build Go Settings CLI
        run: |
          cd packages/raf-settings
          go test -v ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o raf-settings.exe .

      - name: Upload CLI Bin
        uses: actions/upload-artifact@v4
        with:
          name: internal-cli-bin-release
          path: packages/raf-settings/raf-settings.exe
          retention-days: 1

  build-release:
    runs-on: windows-latest
    needs: [build-cli, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno Canary
        uses: denoland/setup-deno@v2
        with:
          deno-version: canary

      - name: Install dependencies
        run: |
          bun install

      - name: Download CLI Bin
        uses: actions/download-artifact@v4
        with:
          name: internal-cli-bin-release
          path: dist/bin

      - name: Bundle & Compile Windows Executable
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p dist/build
          bun run scripts/clean-json.js
          bun run scripts/generate-version.js
          bun build index.tsx \
            --outdir dist/build \
            --target node \
            --minify \
            --sourcemap=external \
            --define process.env.API_URL="\"${API_URL}\"" \
            --define process.env.NODE_ENV="\"production\"" \
            --external @gpuix/native-darwin-arm64 \
            --external @gpuix/native-darwin-universal \
            --external @gpuix/native-win32-x64-msvc

          deno compile \
            --allow-all \
            --no-check \
            --no-terminal \
            --no-config \
            --unsafely-ignore-certificate-errors \
            --target x86_64-pc-windows-msvc \
            --engine v8 \
            --icon assets/icon.ico \
            --output dist/raf-launcher.exe \
            dist/build/index.js

          cp node_modules/@gpuix/native-win32-x64-msvc/gpuix-native.win32-x64-msvc.node dist/

          RELEASE_VERSION=$(node -p "require('./package.json').version")
          powershell -Command "Compress-Archive -Path dist/raf-launcher.exe, dist/gpuix-native.win32-x64-msvc.node, dist/bin -DestinationPath dist/RiseAndFall-Launcher_Portable_v${RELEASE_VERSION}.zip -Force"

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isccPath = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue)?.Source
          if (-not $isccPath) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } else {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup --no-progress -y
              if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
                $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
              }
            }
          }

          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            Write-Error "Failed to locate ISCC.exe"
            exit 1
          }

          Write-Host "Using ISCC at: $isccPath"
          & $isccPath "/DMyAppVersion=$version" installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-release
          path: |
            dist/RiseAndFall-Launcher_Setup_*.exe
            dist/RiseAndFall-Launcher_Portable_*.zip

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          preserve_order: true
          files: |
            dist/RiseAndFall-Launcher_Setup_*.exe
            dist/RiseAndFall-Launcher_Portable_*.zip

