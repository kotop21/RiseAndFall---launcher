name: Build Dev Launcher

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Build Windows Dev Executable (With Console)
        shell: bash
        run: |
          mkdir -p dist
          bun run scripts/generate-version.ts
          bun build --compile index.tsx --outfile dist/raf-launcher.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raf-launcher-windows-dev-x64
          path: dist/raf-launcher.exe
